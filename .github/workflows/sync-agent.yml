name: Sync AI Studio Agent Repo

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

# Prevent a scheduled sync and a manual sync from running at the same time
concurrency:
  group: onlinefirst-jormass-agent-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Update destination to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Preserve sync workflow
        run: |
          mkdir -p /tmp/onlinefirst-workflow
          cp .github/workflows/sync-agent.yml /tmp/onlinefirst-workflow/sync-agent.yml

      - name: Clone AI Studio source repository
        run: |
          rm -rf /tmp/agent-source

          git clone --depth 1 \
            https://github.com/onlinefirst2026-beep/Online1stJOR-NG.git \
            /tmp/agent-source

      - name: Sync AI Studio files
        run: |
          rsync -av --delete \
            --exclude ".git" \
            --exclude ".github/workflows/sync-agent.yml" \
            /tmp/agent-source/ ./

      - name: Restore sync workflow
        run: |
          mkdir -p .github/workflows
          cp /tmp/onlinefirst-workflow/sync-agent.yml \
            .github/workflows/sync-agent.yml

      - name: Commit and push updates
        run: |
          git config user.name "OnlineFirst Sync Bot"
          git config user.email "onlinefirst-sync@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No new AI Studio changes to sync."
            exit 0
          fi

          git commit -m "Sync latest AI Studio changes"
          git push origin main
